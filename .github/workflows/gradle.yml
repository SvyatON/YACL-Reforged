name: Forge builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: |
          python3 - <<'PY'
          import json, os, runpy
          entries = runpy.run_path("gradle/package-project-sources.py")["release_profiles"]()
          unique = {entry["version"]: entry for entry in reversed(entries)}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("value=" + json.dumps({"include": list(unique.values())}) + "\n")
          PY
  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -p '${{ matrix.project }}' '${{ matrix.artifactTarget || matrix.target }}:buildAndCollect' -Ptargets=${{ matrix.artifactTarget || matrix.target }} --configure-on-demand --max-workers=2 --console=plain
      - run: python3 gradle/package-project-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: yacl-reforged-${{ matrix.artifactTarget || matrix.target }}
          path: |
            ${{ matrix.project }}/build/releases/*.jar
            build/releases/YACL-Reforged-project-sources.zip
          if-no-files-found: error
