modLoader = "javafml"
loaderVersion = "${loaderVersion}"
issueTrackerURL = "https://github.com/SvyatON/YACL-Reforged/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/project/Uwg487V8"
modproperties = { sourcesURL = "https://github.com/SvyatON/YACL-Reforged" }
authors = "${mod_author}"
description = '''
${mod_description}
'''
logoFile = "yacl-reforged-256.png"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forgeVersion}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

